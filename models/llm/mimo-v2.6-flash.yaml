model: mimo-v2.6-flash
label:
  zh_Hans: MiMo-V2.6-Flash
  en_US: MiMo-V2.6-Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0.0
    max: 1.5
    help:
      zh_Hans: 仅关闭思考时生效；思考模式固定为 1.0。
      en_US: Applies only with thinking disabled; fixed at 1.0 while thinking.
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.01
    max: 1.0
    help:
      zh_Hans: 仅关闭思考时生效；思考模式固定为 0.95。
      en_US: Applies only with thinking disabled; fixed at 0.95 while thinking.
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 8192
    min: 1
    max: 128000
  - name: thinking
    type: boolean
    default: true
    label:
      zh_Hans: 思考模式
      en_US: Thinking mode
  - name: json_mode
    type: boolean
    default: false
    label:
      zh_Hans: JSON 模式
      en_US: JSON mode
    help:
      zh_Hans: 开启后使用 json_object；需要在提示词中要求输出 JSON，不支持 JSON Schema。
      en_US: Uses json_object when enabled; request JSON in the prompt. JSON Schema is not supported.
pricing:
  input: '1'
  output: '2'
  unit: '0.000001'
  currency: RMB