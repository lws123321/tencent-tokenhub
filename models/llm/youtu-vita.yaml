model: youtu-vita
label:
  zh_Hans: YT-VITA
  en_US: YT-VITA
model_type: llm
features:
  - vision
  - video
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 15000
pricing:
  input: '1.2'
  output: '3.5'
  unit: '0.000001'
  currency: RMB