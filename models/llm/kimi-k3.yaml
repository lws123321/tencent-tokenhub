model: kimi-k3
label:
  zh_Hans: Kimi K3
  en_US: Kimi K3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_completion_tokens
    use_template: max_tokens
    type: int
    default: 131072
    min: 1
    max: 1048576
    help:
      zh_Hans: 限制最大输出 Token 数。
      en_US: Limit maximum output tokens.
  - name: reasoning_effort
    type: string
    default: max
    options:
      - max
    label:
      zh_Hans: 推理深度
      en_US: Reasoning effort
    help:
      zh_Hans: Kimi K3 始终开启思考模式，目前仅支持 max。
      en_US: Kimi K3 always thinks and currently supports max only.
pricing:
  input: '20'
  output: '100'
  unit: '0.000001'
  currency: RMB
