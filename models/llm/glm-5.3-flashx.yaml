model: glm-5.3-flashx
label:
  zh_Hans: GLM-5.3-FlashX
  en_US: GLM-5.3-FlashX
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    type: float
    default: 0.95
    min: 0.0
    max: 1.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 16384
    min: 1
    max: 128000
  - name: reasoning_effort
    type: string
    default: max
    options: [low, high, max]
    label:
      zh_Hans: 推理深度
      en_US: Reasoning effort
    help:
      zh_Hans: 模型始终开启思考，不支持关闭。
      en_US: Thinking is always enabled and cannot be disabled.
pricing:
  input: '2'
  output: '7'
  unit: '0.000001'
  currency: RMB