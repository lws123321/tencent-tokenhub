model: hunyuan-2.0-thinking-20251109
label:
  zh_Hans: HY 2.0 Think
  en_US: HY 2.0 Think
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 192000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.7
    min: 0.0
    max: 2.0
    help:
      zh_Hans: 控制生成结果的多样性和随机性。
      en_US: Control the diversity and randomness of generated results.
  - name: top_p
    use_template: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
    help:
      zh_Hans: 核采样参数，控制输出多样性。
      en_US: Nucleus sampling parameter for output diversity.
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 64000
    help:
      zh_Hans: 限制最大输出 Token 数。
      en_US: Limit maximum output tokens.
pricing:
  input: '4'
  output: '16'
  unit: '0.000001'
  currency: RMB
