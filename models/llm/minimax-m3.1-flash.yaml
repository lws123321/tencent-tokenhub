model: minimax-m3.1-flash
label:
  zh_Hans: MiniMax-M3.1-Flash
  en_US: MiniMax-M3.1-Flash
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 1.0
    min: 0.0
    max: 2.0
  - name: top_p
    use_template: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 8192
    min: 1
    max: 512000
pricing:
  input: '1'
  output: '4'
  unit: '0.000001'
  currency: RMB