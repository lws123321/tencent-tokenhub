model: kimi-k2.8-preview
label:
  zh_Hans: Kimi K2.8 Preview
  en_US: Kimi K2.8 Preview
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
  - video
  - structured-output
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 32768
    min: 1
    max: 1000000
  - name: reasoning_effort
    type: string
    default: max
    options: [low, high, max]
    label:
      zh_Hans: 推理深度
      en_US: Reasoning effort
    help:
      zh_Hans: 模型始终开启思考；采样参数固定，不支持自定义。
      en_US: Thinking is always enabled; sampling parameters are fixed.
pricing:
  input: '6.5'
  output: '27'
  unit: '0.000001'
  currency: RMB