model: glm-5.3
label:
  zh_Hans: GLM-5.3
  en_US: GLM-5.3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
model_properties:
  mode: chat
  context_size: 1000000
parameter_rules:
  - name: temperature
    use_template: temperature
    type: float
    default: 0.7
    min: 0.0
    max: 2.0
    help:
      zh_Hans: 控制生成结果的多样性和随机性。
      en_US: Control the diversity and randomness of generated results.
  - name: top_p
    use_template: top_p
    type: float
    default: 1.0
    min: 0.0
    max: 1.0
    help:
      zh_Hans: 核采样参数，控制输出多样性。
      en_US: Nucleus sampling parameter for output diversity.
  - name: max_tokens
    use_template: max_tokens
    type: int
    default: 4096
    min: 1
    max: 128000
    help:
      zh_Hans: 限制最大输出 Token 数。
      en_US: Limit maximum output tokens.
  - name: reasoning_effort
    type: string
    default: max
    options:
      - max
      - high
      - low
    label:
      zh_Hans: 推理深度
      en_US: Reasoning effort
    help:
      zh_Hans: 控制模型的推理深度。该模型始终开启思考模式。
      en_US: Control reasoning depth. This model always thinks.
pricing:
  input: '8'
  output: '28'
  unit: '0.000001'
  currency: RMB
